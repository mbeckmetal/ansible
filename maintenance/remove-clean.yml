---
- name: System Maintenance and Cleanup
  hosts: all
  become: true
  tasks:
    - name: Run apt autoclean to clear out old downloaded archive files
      ansible.builtin.apt:
        autoclean: true

    - name: Run apt autoremove to clean up orphaned dependencies
      ansible.builtin.apt:
        autoremove: true
        purge: true # Optional: changes autoremove to also purge old configuration files
