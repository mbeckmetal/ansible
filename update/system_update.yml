---
- name: Fleet OS Update and Patching
  hosts: all
  become: true
  tasks:
    - name: Update apt repository and upgrade packages (Ubuntu/Debian)
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Upgrade all packages (RHEL/Rocky/CentOS)
      ansible.builtin.dnf:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"

    - name: Check if a reboot is required (Debian/Ubuntu)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot the server if required
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible Semaphore for updates"
      when: (reboot_required_file.stat.exists is defined and reboot_required_file.stat.exists)
